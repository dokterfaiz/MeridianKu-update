<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MeridianKu</title>
<style>
:root{
  --paper:#F6F3EC; --card:#FFFFFF; --ink:#1E2B2A; --muted:#66716C; --line:#E3DCCD; --soft:#EFEAE0;
  --c:#1F7A63; --on-c:#FFFFFF; --pt:#C8463D; --gold:#B8860B; --good:#1F8A4C; --bad:#C0392B;
  --good-bg:#E3F4EA; --bad-bg:#FBE6E3; --warn-bg:#FFF4DA; --warn:#8A5A00;
  --skin:#F3DCC8; --skin-line:#B98767; --lt:#9A8676;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --hanzi:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Noto Sans SC",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --card:#1B2321; --ink:#E9E5DB; --muted:#9AA39E; --line:#2E3936; --soft:#222C29;
  --c:#4DB391; --on-c:#0E1513; --pt:#F06A5E; --gold:#E0B04A; --good:#4CC27F; --bad:#F0796C;
  --good-bg:#16352A; --bad-bg:#3A1D1A; --warn-bg:#3A2E12; --warn:#F0C766;
  --skin:#5B4638; --skin-line:#C9A486; --lt:#BBA898; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#121816; --card:#1B2321; --ink:#E9E5DB; --muted:#9AA39E; --line:#2E3936; --soft:#222C29;
  --c:#4DB391; --on-c:#0E1513; --pt:#F06A5E; --gold:#E0B04A; --good:#4CC27F; --bad:#F0796C;
  --good-bg:#16352A; --bad-bg:#3A1D1A; --warn-bg:#3A2E12; --warn:#F0C766;
  --skin:#5B4638; --skin-line:#C9A486; --lt:#BBA898; color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:720px;margin:0 auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:1.45rem;margin:4px 0 6px;line-height:1.25}
h2{font-size:1.15rem;margin:18px 0 8px}
h3{font-size:1rem;margin:14px 0 6px}
.muted,.small{color:var(--muted)} .small{font-size:.88rem}
.hz{font-family:var(--hanzi);font-weight:600}

/* ---------- kepala halaman ---------- */
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;color:var(--c)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.fire.off{filter:grayscale(1);opacity:.6}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.2rem;flex:none}

/* ---------- kartu & tombol ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;background:var(--c);color:var(--on-c);font-weight:700;font-size:1.02rem;margin:10px 0;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 70%,#000)}
.btn small{display:block;font-weight:500;opacity:.9;font-size:.86rem}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.slim{padding:9px 12px;font-size:.95rem;margin:6px 0}
.row{display:flex;gap:10px;align-items:stretch}.row>*{flex:1}
.link{background:none;border:0;color:var(--c);font-weight:700;padding:6px 0}

/* ---------- target harian ---------- */
.goal{display:flex;align-items:center;gap:10px}
.gbar{flex:1;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--c));border-radius:999px;transition:width .5s}

/* ---------- daftar meridian ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mcard{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--mc);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:96px}
.mcard:active{transform:translateY(2px)}
.mcard b{font-size:1rem;line-height:1.2}
.mcard .k{font-weight:800;color:var(--mc);font-size:.85rem;letter-spacing:.5px}
.mcard .hz{font-size:.85rem;color:var(--muted);font-weight:500}
.mcard .acc{margin-top:auto;font-size:.8rem;color:var(--muted)}
.mcard .lock{position:absolute;right:8px;top:8px;font-size:.9rem}
.mini{height:5px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:4px}.mini i{display:block;height:100%;background:var(--mc)}

/* ---------- daftar titik ---------- */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.prow .k{font-weight:800;min-width:58px;color:var(--mc,var(--c))}
.prow .nm{flex:1;min-width:0}.prow .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{color:var(--muted)}
.mbar{display:inline-flex;gap:2px;flex:none}.mbar i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.mbar.m1 i:nth-child(1),.mbar.m2 i:nth-child(-n+2){background:var(--c)}.mbar.m3 i{background:var(--gold)}

/* ---------- gambar titik ---------- */
.fig{background:var(--soft);border-radius:16px;padding:6px;margin:10px auto;max-width:340px}
.fig.sm{max-width:240px}
.pfig{display:block;width:100%;height:auto}
.pfig .sk{fill:var(--skin);stroke:var(--skin-line);stroke-width:1.6;stroke-linejoin:round}
.pfig .ln{fill:none;stroke:var(--skin-line);stroke-width:1.1;opacity:.8}
.pfig .lt{font:600 7px var(--body);fill:var(--lt)}
.pfig .jl{fill:none;stroke-width:1.2;stroke-dasharray:3 2.5;opacity:.55}
.pfig .p2{opacity:.5}
.pfig .pt{fill:var(--pt);stroke:#fff;stroke-width:1.6}
.pfig .ring{fill:none;stroke:var(--pt);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
.pfig .pl{font:800 9px var(--body);fill:var(--pt);paint-order:stroke;stroke:var(--soft);stroke-width:3px;stroke-linejoin:round}
.pfig .ab{font:800 9px var(--body);fill:#fff}
.pfig .abc{fill:var(--c);stroke:#fff;stroke-width:1.2}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}

/* ---------- detail titik ---------- */
.nama{display:flex;align-items:center;gap:14px}
.nama .hzbig{font-family:var(--hanzi);font-size:2.6rem;line-height:1;font-weight:700;white-space:nowrap;flex:none}
.nama .py{font-size:1.25rem;font-weight:700}
.sec{margin:12px 0}.sec h3{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:.92rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.9rem}
.tag.role{background:color-mix(in srgb,var(--c) 12%,var(--card));border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin-top:6px;font-size:.95rem}
.nav2{display:flex;gap:10px;margin-top:14px}.nav2 button{flex:1}

/* ---------- kuis ---------- */
.qtop{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .4s}
.cnt{font-weight:700;min-width:46px;text-align:right}
.combo{font-weight:800;color:var(--gold);min-width:40px;text-align:center}
.q{font-size:1.15rem;font-weight:600;margin:14px 0 4px;line-height:1.4}
.q .big{font-size:1.6rem}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1rem;box-shadow:0 3px 0 var(--line);line-height:1.35}
.opt.c{text-align:center;font-weight:800;font-size:1.25rem}
.opt:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.opt small{display:block;color:var(--muted);font-size:.85rem}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;border:1.5px solid;animation:slide .3s ease-out}
.fb.good{background:var(--good-bg);border-color:var(--good)}.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb b{display:block;font-size:1.05rem}
@keyframes slide{from{opacity:0;transform:translateY(10px)}}
.xp{position:fixed;left:50%;top:40%;font-weight:800;font-size:1.3rem;color:var(--gold);pointer-events:none;animation:xp .9s ease-out forwards;z-index:70}
@keyframes xp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}

/* ---------- kartu belajar ---------- */
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:300px;text-align:center}
.flash .front{font-size:1.5rem;font-weight:800;margin-top:6px}

/* ---------- cocokkan ---------- */
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.board .col{display:flex;flex-direction:column;gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;font-weight:600;min-height:52px;box-shadow:0 3px 0 var(--line);font-size:.95rem}
.tile.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.tile.done{border-color:var(--good);background:var(--good-bg);opacity:.5;pointer-events:none;box-shadow:none}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}

/* ---------- hasil ---------- */
.res{text-align:center}.stars{font-size:2.6rem;letter-spacing:6px;margin:6px 0}
.wrongs .card{text-align:left}

/* ---------- lembar bawah ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;max-width:720px;width:100%}
.nav button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.75rem;font-weight:600;color:var(--muted)}
.nav button span{font-size:1.3rem}.nav button.on{color:var(--c)}
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet h2{margin-top:0}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 0 var(--line)}
.mode .mi{font-size:1.5rem}.mode small{color:var(--muted);line-height:1.3}
.mode:active{transform:translateY(2px)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;z-index:80;max-width:90vw;text-align:center;animation:slide .3s}

/* ---------- formulir ---------- */
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=search]{width:100%;font:inherit;font-size:1.05rem;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--c)}
.shake{animation:shake .35s}
.avs{display:flex;flex-wrap:wrap;gap:6px}.avs button{font-size:1.5rem;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}.avs button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bdg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.8rem}
.bdg span{display:block;font-size:1.6rem}.bdg.off{opacity:.35;filter:grayscale(1)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

/** Peran baku sebuah titik, dalam bentuk [{kat, teks}] — kat dipakai untuk soal. */
function peranBaku(k) {
  const out = [], m = k.replace(/\d+$/, ''), M = MER[m];
  const cari = (tabel, ket) => { for (const [a, b] of Object.entries(tabel)) if (b === k) out.push(ket(a)); };
  if (LIMA_SHU[m]) {
    const i = LIMA_SHU[m].indexOf(k);
    if (i >= 0) {
      const yin = M.jenis.startsWith('Yin'), u = SHU_UNSUR[yin ? 'yin' : 'yang'][i];
      out.push({ kat: 'shu' + i, teks: `Titik ${SHU_NAMA[i]}, unsur ${u}` });
      if (u === IBU[M.unsur]) out.push({ kat: 'tonik', teks: `Titik tonifikasi (titik "ibu") meridian ${M.nama}` });
      if (u === ANAK[M.unsur]) out.push({ kat: 'sedasi', teks: `Titik sedasi (titik "anak") meridian ${M.nama}` });
      if (u === M.unsur) out.push({ kat: 'horary', teks: `Titik unsur asli (horary) meridian ${M.nama}` });
    }
  }
  cari(YUAN, a => ({ kat: 'yuan', teks: `Titik Yuan (sumber) meridian ${MER[a].nama}` }));
  cari(LUO, a => ({ kat: 'luo', teks: MER[a] ? `Titik Luo (penghubung) meridian ${MER[a].nama}` : `Titik ${a}` }));
  cari(XI, a => ({ kat: 'xi', teks: `Titik Xi (celah) ${MER[a] ? 'meridian ' + MER[a].nama : a}` }));
  cari(MU, a => ({ kat: 'mu', teks: `Titik Mu depan (titik kumpul) organ ${a}` }));
  cari(SHU_PUNGGUNG, a => ({ kat: 'bshu', teks: `Titik Shu punggung organ ${a}` }));
  cari(HUI, a => ({ kat: 'hui', teks: `Titik Hui (pengaruh) untuk ${a}` }));
  cari(PEMBUKA, a => ({ kat: 'buka', teks: `Titik pembuka meridian istimewa ${a}` }));
  cari(HE_BAWAH, a => ({ kat: 'hebawah', teks: `Titik He bawah organ ${a}` }));
  if (JENDELA_LANGIT.includes(k)) out.push({ kat: 'langit', teks: 'Titik Jendela Langit' });
  cari(KOMANDO, a => ({ kat: 'komando', teks: `Salah satu Empat Titik Komando: ${a}` }));
  return out;
}

  const roles = [...pb.map(r => `<span class="tag role">${esc(r.teks)}</span>`), ...(t.peran ? [`<span class="tag">${esc(t.peran)}</span>`] : [])];

VIEW.cari = (q = '') => {
  tabAktif = 'cari';
  app.innerHTML = kepala('🔍 Cari titik') + `<input type="search" id="q" placeholder="Kode, nama, arti, atau keluhan (mis. LI4, hegu, sakit kepala)" value="${esc(q)}" autocomplete="off">
    <div id="hasil" class="plist" style="margin-top:12px"></div>` + navBawah();
  const inp = document.getElementById('q'), out = document.getElementById('hasil');
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const isi = () => {
    const v = norm(inp.value.trim()); NAV[NAV.length - 1][1] = [inp.value];
    if (v.length < 2) { out.innerHTML = '<p class="small">Ketik minimal 2 huruf. Contoh: <b>ST36</b>, <b>zusanli</b>, <b>lambung</b>, <b>sulit tidur</b>.</p>'; return; }
    const kode = v.replace(/[\s-]/g, '');
    const skor = t => { const k = norm(t.k).replace(/-/g, '');
      if (k === kode) return 100; if (k.startsWith(kode)) return 60; if (norm(t.py).replace(/\s/g, '').includes(v.replace(/\s/g, ''))) return 50;
      if (norm(t.arti).includes(v)) return 40; if (norm(t.ind).includes(v)) return 20; if (norm(t.lok + ' ' + t.peran + ' ' + t.makna).includes(v)) return 10; return 0; };
    const hs = TITIK.map(t => [t, skor(t)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 60);
    out.innerHTML = hs.length ? hs.map(([t]) => `<button class="prow" style="--mc:${warnaMer(t.k)}" data-act="titik" data-k="${t.k}"><span class="k">${t.k}</span>
      <span class="nm"><div><b>${esc(t.py)}</b> <span class="hz">${t.hz}</span> ${terbuka(merOf(t.k)) ? '' : '🔒'}</div><div><small>${esc(t.arti)}</small></div></span></button>`).join('')
      : '<p class="small">Tidak ditemukan.</p>';
  };
  inp.addEventListener('input', isi); isi(); if (!q) setTimeout(() => inp.focus(), 50);
};

/* ======================== KUIS ======================== */
let KUIS = null;
function poolCakupan(cak, mode) {
  let pool = (cak === 'semua' ? TITIK : titikMer(cak)).filter(t => terbuka(merOf(t.k)));
  if (mode === 'peran') { const pr = pool.filter(t => peranBaku(t.k).length); if (pr.length >= 4) pool = pr; }
  return pool;
}
function mulaiKuis(cak, mode, { seed = null, lawan = null, n = 10 } = {}) {
  const pool = poolCakupan(cak, mode);
  if (pool.length < 4) { toast('Titik di sini belum cukup. Aktifkan aplikasi untuk membuka semua titik.'); return; }
  const benih = seed ?? Math.floor(Math.random() * 1048576);
  const soal = denganBenih(benih, () => buatSesi(P(), pool, mode, n, seed !== null || lawan !== null));
  KUIS = { cak, mode, soal, i: 0, skor: 0, combo: 0, xp: 0, salah: [], benih, lawan, jawab: false };
  tutupSheet(); ke('kuis');
}
function mulaiUlang() {
  const p = P(), pool = Object.keys(p.stats).filter(k => terbuka(merOf(k)) && hafal(p, k) < 3).map(k => T[k]);
  if (pool.length < 4) { toast('Belum ada cukup titik yang lemah. Teruskan latihan dulu!'); return; }
  const soal = buatSesi(p, pool, 'campur', 10, false);
  KUIS = { cak: 'ulang', mode: 'campur', soal, i: 0, skor: 0, combo: 0, xp: 0, salah: [], benih: 0, lawan: null, jawab: false };
  ke('kuis');
}

VIEW.kuis = () => {
  const K = KUIS; if (!K) { NAV.pop(); return tampil(); }
  if (K.kilat) return VIEW.kilat();
  if (K.i >= K.soal.length) return hasilKuis();
  const s = K.soal[K.i];
  app.innerHTML = `<div class="qtop"><button class="back" data-act="kembali" aria-label="Keluar">✕</button>
    <div class="bar"><i style="width:${K.i / K.soal.length * 100}%"></i></div><span class="combo">${K.combo >= 2 ? '🔥' + K.combo : ''}</span><span class="cnt">${K.i + 1}/${K.soal.length}</span></div>
  ${s.fig ? `<div class="fig sm">${figSVG(s.fig.g, { sorot: s.fig.sorot, label: s.fig.label !== false && !s.fig.huruf, jalur: false, huruf: s.fig.huruf })}</div>` : ''}
  <div class="q">${s.teks}</div>
  <div class="opts ${s.dua ? 'two' : ''}">${s.opsi.map((o, i) => `<button class="opt ${o.c ? 'c' : ''}" data-act="jawab" data-i="${i}">${o.h}</button>`).join('')}</div><div id="fb"></div>`;
};
function jawab(i) {
  const K = KUIS, s = K.soal[K.i]; if (K.jawab) return; K.jawab = true;
  const o = s.opsi[i], benar = !!o.benar, p = P();
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (s.opsi[j].benar) b.classList.add('right'); });
  if (!benar) document.querySelectorAll('.opt')[i].classList.add('wrong');
  catat(p, s.k, benar);
  if (benar) { K.skor++; K.combo++; const x = 10 + Math.min(K.combo - 1, 5) * 2; K.xp += x; tambahXP(p, x); SFX.benar(); terbang('+' + x + ' XP'); }
  else { K.combo = 0; K.salah.push(s); SFX.salah(); }
  simpan();
  document.getElementById('fb').innerHTML = `<div class="fb ${benar ? 'good' : 'bad'}"><b>${benar ? pilih(['Tepat! ✅', 'Benar! 👍', 'Bagus! ✨']) : 'Belum tepat'}</b>${s.jelas}</div>
    <button class="btn" data-act="lanjut">${K.i + 1 < K.soal.length ? 'Lanjut' : 'Lihat hasil'}</button>`;
  document.getElementById('fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function terbang(t) { const e = document.createElement('div'); e.className = 'xp'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 900); }
function hasilKuis() {
  const K = KUIS, p = P(), n = K.soal.length, sk = K.skor;
  if (!K.selesai) {
    K.selesai = true; p.sesi = (p.sesi || 0) + 1; if (sk === n) p.sempurna = (p.sempurna || 0) + 1;
    const bonus = sk === n ? 20 : 5; K.xp += bonus; tambahXP(p, bonus); K.lencana = cekLencana(p); simpan(); SFX.selesai(); if (sk >= n * .8) konfeti();
  }
  const bintang = sk === n ? 3 : sk >= n * .7 ? 2 : sk >= n * .5 ? 1 : 0;
  const cak = K.cak === 'semua' ? 'Semua titik' : K.cak === 'ulang' ? 'Ulangi yang lemah' : MER[K.cak].nama;
  const kode = K.cak !== 'ulang' ? kodeTantangan(K.benih, CAKUPAN.indexOf(K.cak), MODE_KODE.indexOf(K.mode), sk) : '';
  const vs = K.lawan !== null ? `<div class="card"><b>⚔️ Tantangan</b><p style="margin:4px 0 0">Skor teman: <b>${K.lawan}</b> · Skor Anda: <b>${sk}</b><br>${sk > K.lawan ? 'Anda menang! 🏆' : sk === K.lawan ? 'Seri! 🤝' : 'Teman Anda menang kali ini. Coba lagi!'}</p></div>` : '';
  app.innerHTML = `<div class="res"><h1>Selesai!</h1><div class="stars">${'⭐'.repeat(bintang)}${'☆'.repeat(3 - bintang)}</div>
    <p><b style="font-size:1.4rem">${sk}/${n}</b> benar · +${K.xp} XP</p><p class="small">${cak} · ${MODES[K.mode].nama}</p></div>${vs}
    ${K.lencana && K.lencana.length ? `<div class="card"><b>Lencana baru!</b> ${K.lencana.map(b => `${b.ic} ${b.nama}`).join(', ')}</div>` : ''}
    ${K.salah.length ? `<h2>Yang perlu diulang</h2><div class="wrongs">${K.salah.map(s => `<div class="card"><div class="small">${s.teks}</div><div style="margin-top:4px">${s.jelas}</div>
      <button class="link" data-act="titik" data-k="${s.k}">Buka ${s.k} →</button></div>`).join('')}</div>` : ''}
    <button class="btn" data-act="lagi">🔁 Latihan lagi</button>
    ${kode ? `<button class="btn alt" data-act="bagikantantangan" data-kode="${kode}">⚔️ Tantang teman dengan soal yang sama</button>` : ''}
    <button class="btn alt" data-act="keberanda">🏠 Beranda</button>`;
}

/* ---------- kuis kilat 60 detik ---------- */
function mulaiKilat() {
  const pool = poolCakupan('semua', 'campur');
  KUIS = { kilat: true, pool, skor: 0, salah: 0, akhir: Date.now() + 60000, s: null, xp: 0, mode: 'nama' };
  ke('kuis');
}
VIEW.kilat = () => {
  const K = KUIS, sisa = Math.max(0, Math.ceil((K.akhir - Date.now()) / 1000));
  if (sisa <= 0) return hasilKilat();
  if (!K.s) { const t = pilih(K.pool); K.s = { ...(pilih([PEMBUAT.artiNama, PEMBUAT.namaDariArti, PEMBUAT.meridianNya, PEMBUAT.lokasiKeNama])(t) || PEMBUAT.meridianNya(t)), k: t.k }; }
  const s = K.s;
  app.innerHTML = `<div class="qtop"><button class="back" data-act="kembali" aria-label="Keluar">✕</button><div class="bar"><i id="waktu" style="width:${sisa / 60 * 100}%"></i></div>
    <span class="cnt">⏱ <span id="detik">${sisa}</span></span><span class="combo">✅ ${K.skor}</span></div>
    ${s.fig ? `<div class="fig sm">${figSVG(s.fig.g, { sorot: s.fig.sorot, label: false, jalur: false })}</div>` : ''}
    <div class="q">${s.teks}</div><div class="opts">${s.opsi.map((o, i) => `<button class="opt" data-act="jawabkilat" data-i="${i}">${o.h}</button>`).join('')}</div>`;
  clearInterval(K.timer);
  K.timer = setInterval(() => { const d = Math.max(0, Math.ceil((K.akhir - Date.now()) / 1000)), e = document.getElementById('detik');
    if (!e || KUIS !== K) { clearInterval(K.timer); return; } e.textContent = d; document.getElementById('waktu').style.width = d / 60 * 100 + '%'; if (d <= 0) { clearInterval(K.timer); hasilKilat(); } }, 250);
};
function jawabKilat(i) {
  const K = KUIS, s = K.s, benar = !!s.opsi[i].benar, p = P();
  catat(p, s.k, benar);
  if (benar) { K.skor++; K.xp += 5; tambahXP(p, 5); SFX.benar(); } else { K.salah++; SFX.salah(); K.akhir -= 3000; toast('−3 detik', 900); }
  K.s = null; simpan(); VIEW.kilat();
}
function hasilKilat() {
  const K = KUIS, p = P(); clearInterval(K.timer);
  if (!K.selesai) { K.selesai = true; p.sesi = (p.sesi || 0) + 1; p.kilat = Math.max(p.kilat || 0, K.skor); K.lencana = cekLencana(p); simpan(); SFX.selesai(); if (K.skor >= 15) konfeti(); }
  app.innerHTML = `<div class="res"><h1>⚡ Waktu habis!</h1><p><b style="font-size:2rem">${K.skor}</b> jawaban benar</p><p class="small">${K.salah} salah · +${K.xp} XP · rekor Anda ${p.kilat}</p></div>
    ${K.lencana && K.lencana.length ? `<div class="card"><b>Lencana baru!</b> ${K.lencana.map(b => `${b.ic} ${b.nama}`).join(', ')}</div>` : ''}
    <button class="btn" data-act="kilat">⚡ Main lagi</button><button class="btn alt" data-act="keberanda">🏠 Beranda</button>`;
}

/* ---------- kartu belajar ---------- */
VIEW.kartu = (cak, i = 0, balik = false) => {
  const p = P();
  if (!KUIS || KUIS.jenis !== 'kartu' || KUIS.cak !== cak) {
    const urut = titikMer(cak).slice().sort((a, b) => hafal(p, a.k) - hafal(p, b.k) || TITIK.indexOf(a) - TITIK.indexOf(b));
    KUIS = { jenis: 'kartu', cak, urut, ingat: 0 };
  }
  const K = KUIS;
  if (i >= K.urut.length) {
    app.innerHTML = `<div class="res"><h1>📖 Selesai!</h1><p>${K.ingat} dari ${K.urut.length} kartu sudah Anda ingat.</p></div>
      <button class="btn" data-act="pilihmode" data-cak="${cak}">🧠 Uji dengan kuis</button><button class="btn alt" data-act="kembali">← Kembali ke meridian</button>`;
    cekLencana(p); simpan(); return;
  }
  const t = K.urut[i];
  app.innerHTML = `<div class="qtop"><button class="back" data-act="kembali" aria-label="Keluar">✕</button><div class="bar"><i style="width:${i / K.urut.length * 100}%"></i></div><span class="cnt">${i + 1}/${K.urut.length}</span></div>
  <div class="flash" style="margin-top:12px"><div class="fig sm">${figSVG(t.g, { sorot: [t.k], label: balik })}</div>
  ${balik ? `<div class="nama" style="justify-content:center"><span class="hzbig" style="font-size:2rem">${t.hz}</span><div style="text-align:left"><div class="py">${t.k} ${esc(t.py)}</div><div>“${esc(t.arti)}”</div></div></div>
    <p style="text-align:left">${esc(t.lok)}</p>
    <div class="tags" style="justify-content:center">${peranBaku(t.k).map(r => `<span class="tag role">${esc(r.teks)}</span>`).join('')}${indItems(t).slice(0, 4).map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>`
    : `<div class="front">Titik apakah ini?</div><p class="small">Ingat-ingat kode, nama, dan artinya, lalu ketuk “Lihat jawaban”.</p>`}</div>
  ${balik ? `<div class="row"><button class="btn alt" data-act="kartujawab" data-v="0" data-i="${i}">😕 Belum ingat</button><button class="btn" data-act="kartujawab" data-v="1" data-i="${i}">😊 Sudah ingat</button></div>
    <button class="link" data-act="titik" data-k="${t.k}">Buka detail ${t.k} →</button>`
    : `<button class="btn" data-act="kartubalik" data-i="${i}">Lihat jawaban</button>`}`;
};

/* ---------- cocokkan pasangan ---------- */
function mulaiCocok(cak) {
  const pool = poolCakupan(cak, 'nama'), pilihan = kocok(pool).filter((t, i, a) => a.findIndex(x => x.arti === t.arti) === i).slice(0, 5);
  if (pilihan.length < 5) { toast('Titik belum cukup untuk permainan ini.'); return; }
  KUIS = { jenis: 'cocok', cak, items: pilihan, kiri: kocok(pilihan.map(t => t.k)), kanan: kocok(pilihan.map(t => t.k)), sel: null, beres: new Set(), salah: 0 };
  tutupSheet(); ke('cocok');
}
VIEW.cocok = () => {
  const K = KUIS;
  if (K.beres.size === K.items.length) {
    const p = P(), xp = Math.max(10, 30 - K.salah * 5); tambahXP(p, xp); p.sesi = (p.sesi || 0) + 1; K.items.forEach(t => catat(p, t.k, true)); const lb = cekLencana(p); simpan(); SFX.selesai(); konfeti(40);
    app.innerHTML = `<div class="res"><h1>🧩 Semua cocok!</h1><p>${K.salah} kali salah · +${xp} XP</p></div>${lb.length ? `<div class="card"><b>Lencana baru!</b> ${lb.map(b => b.ic + ' ' + b.nama).join(', ')}</div>` : ''}
      <button class="btn" data-act="cocoklagi" data-cak="${K.cak}">🔁 Main lagi</button><button class="btn alt" data-act="keberanda">🏠 Beranda</button>`;
    return;
  }
  app.innerHTML = `<div class="qtop"><button class="back" data-act="kembali" aria-label="Keluar">✕</button><div class="bar"><i style="width:${K.beres.size / K.items.length * 100}%"></i></div><span class="cnt">${K.beres.size}/${K.items.length}</span></div>
  <div class="q">Pasangkan kode titik dengan arti namanya.</div>
  <div class="board"><div class="col">${K.kiri.map(k => `<button class="tile ${K.beres.has(k) ? 'done' : ''} ${K.sel === k ? 'sel' : ''}" data-act="cocokkiri" data-k="${k}"><b>${k}</b><br><small>${esc(T[k].py)}</small></button>`).join('')}</div>
  <div class="col">${K.kanan.map(k => `<button class="tile ${K.beres.has(k) ? 'done' : ''}" data-act="cocokkanan" data-k="${k}">${esc(T[k].arti)}</button>`).join('')}</div></div>`;
};

/* ---------- pilihan mode & tantangan ---------- */
function lembarMode(cak) {
  const nama = cak === 'semua' ? 'Semua titik' : `${cak} · ${MER[cak].nama}`;
  sheet(`<h2>🧠 Kuis: ${nama}</h2><div class="modes">${Object.entries(MODES).map(([k, v]) => `<button class="mode" data-act="mulai" data-cak="${cak}" data-mode="${k}"><span class="mi">${v.ic}</span><b>${v.nama}</b><small>${v.ket}</small></button>`).join('')}
    <button class="mode" data-act="cocok" data-cak="${cak}"><span class="mi">🧩</span><b>Cocokkan</b><small>Pasangkan kode dan arti nama</small></button></div>
    <p class="small" style="margin-top:12px">Titik dianggap <b>hafal</b> bila 4 dari 5 jawaban terakhirnya benar.</p>`);
}
function lembarTantangan() {
  sheet(`<h2>⚔️ Tantangan teman</h2><p>Selesaikan latihan, lalu bagikan kodenya. Teman yang memasukkan kode akan mendapat soal yang sama persis.</p>
  <label for="kodet">Punya kode dari teman?</label><input id="kodet" type="text" autocapitalize="characters" placeholder="MK-XXXX-XXXX" maxlength="14">
  <button class="btn" data-act="terimatantangan">Terima tantangan</button>
  <button class="btn alt" data-act="mulai" data-cak="semua" data-mode="campur">Buat tantangan baru (mulai latihan)</button>`);
}

/* ======================== AKSI ======================== */
let avPilih = null;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-tab]'); if (!b || b.disabled) return;
  if (b.dataset.tab) return tab(b.dataset.tab);
  const d = b.dataset, p = P();
  switch (d.act) {
    case 'kembali': kembali(); break;
    case 'tutup': tutupSheet(); break;
    case 'meridian': terbuka(d.m) ? ke('meridian', d.m) : halamanAktivasi(); break;
    case 'titik': tutupSheet(); terbuka(merOf(d.k)) ? ke('titik', d.k) : halamanAktivasi(); break;
    case 'titik-ganti': if (d.k) ganti('titik', d.k); break;
    case 'pilihmode': lembarMode(d.cak); break;
    case 'mulai': mulaiKuis(d.cak, d.mode); break;
    case 'ulang': mulaiUlang(); break;
    case 'kilat': tutupSheet(); if (NAV[NAV.length - 1][0] === 'kuis') NAV.pop(); mulaiKilat(); break;
    case 'jawab': jawab(+d.i); break;
    case 'jawabkilat': jawabKilat(+d.i); break;
    case 'lanjut': KUIS.i++; KUIS.jawab = false; VIEW.kuis(); window.scrollTo(0, 0); break;
    case 'lagi': { const K = KUIS; NAV.pop(); K.cak === 'ulang' ? mulaiUlang() : mulaiKuis(K.cak, K.mode); break; }
    case 'keberanda': KUIS = null; tab('beranda'); break;
    case 'kartu': KUIS = null; ke('kartu', d.cak, 0, false); break;
    case 'kartubalik': ganti('kartu', KUIS.cak, +d.i, true); break;
    case 'kartujawab': { const t = KUIS.urut[+d.i]; catat(p, t.k, d.v === '1'); if (d.v === '1') { KUIS.ingat++; tambahXP(p, 2); } simpan(); ganti('kartu', KUIS.cak, +d.i + 1, false); break; }
    case 'cocok': mulaiCocok(d.cak); break;
    case 'cocoklagi': NAV.pop(); mulaiCocok(d.cak); break;
    case 'cocokkiri': KUIS.sel = d.k; VIEW.cocok(); break;
    case 'cocokkanan': { const K = KUIS; if (!K.sel) { toast('Pilih kode titik di kiri dulu'); break; }
      if (K.sel === d.k) { K.beres.add(d.k); K.sel = null; SFX.benar(); VIEW.cocok(); }
      else { K.salah++; SFX.salah(); b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 400); } break; }
    case 'tantangan': lembarTantangan(); break;
    case 'terimatantangan': { const r = bacaKode(document.getElementById('kodet').value);
      if (!r) { document.getElementById('kodet').classList.add('shake'); toast('Kode tidak dikenali. Periksa lagi hurufnya.'); break; }
      const cak = CAKUPAN[r.cak]; if (cak !== 'semua' && !terbuka(cak)) { halamanAktivasi(); break; }
      mulaiKuis(cak, MODE_KODE[r.mode], { seed: r.seed, lawan: r.skor }); break; }
    case 'bagikantantangan': { const K = KUIS, nama = K.cak === 'semua' ? 'semua titik' : 'meridian ' + MER[K.cak].nama;
      bagikan(`Aku dapat ${K.skor}/${K.soal.length} di kuis ${MODES[K.mode].nama} (${nama}) MeridianKu. Berani tanding? Masukkan kode ini di menu ⚔️ Tantangan teman: ${d.kode}`); break; }
    case 'aktivasi': halamanAktivasi(); break;
    case 'aktifkan': { const id = document.getElementById('aid').value, code = document.getElementById('acode').value;
      const p = LIS2.periksa(id, code);
      if (p && !p.selamanya && p.akhir < LIS2.hariIni()) { document.getElementById('actf').classList.add('shake'); setTimeout(() => document.getElementById('actf')?.classList.remove('shake'), 400); toast(`Kode ini sudah berakhir pada ${LIS2.tanggal(p.akhir)}.`); }
      else if (p) { data.act = { id: normId(id), code: p.selamanya ? normCode(code) : LIS2.nk(code) }; simpan(); tutupSheet(); konfeti(); SFX.selesai(); toast(p.selamanya ? 'MeridianKu aktif. Selamat belajar! 🎉' : `MeridianKu aktif sampai ${LIS2.tanggal(p.akhir)}. Selamat belajar! 🎉`); tampil(); }
      else { document.getElementById('actf').classList.add('shake'); setTimeout(() => document.getElementById('actf')?.classList.remove('shake'), 400); toast('Email/nomor atau kodenya belum cocok.'); } break; }
    case 'paham': data.paham = true; simpan(); tutupSheet(); break;
    case 'penting': lembarPenting(false); break;
    case 'cun': lembarCun(); break;
    case 'istilah': lembarIstilah(); break;
    case 'tema': data.tema = d.v; simpan(); terapkanTema(); tampil(); break;
    case 'suara': data.suara = !data.suara; simpan(); tampil(); break;
    case 'profil': avPilih = null; lembarProfil(); break;
    case 'av': avPilih = d.v; document.querySelectorAll('.avs button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'pakaiprofil': data.cur = +d.i; simpan(); tutupSheet(); tampil(); break;
    case 'profilbaru': { const n = document.getElementById('pnama').value.trim(); if (!n) { toast('Isi nama dulu'); break; }
      data.profiles.push(profilBaru(n, avPilih || pilih(AVATAR))); data.cur = data.profiles.length - 1; simpan(); tutupSheet(); tampil(); break; }
    case 'profilubah': { const n = document.getElementById('pnama').value.trim(); if (n) p.name = n; if (avPilih) p.av = avPilih; simpan(); tutupSheet(); tampil(); break; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'acode') document.querySelector('[data-act=aktifkan]')?.click(); });

/* ---------- mulai ---------- */
terapkanTema();
tab('beranda');
if (!data.paham) lembarPenting(true);
</script>
</body>
</html>
